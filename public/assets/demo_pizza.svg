      <stop offset="0%" stop-color="#261b17"/>
      <stop offset="100%" stop-color="#120c0a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#pizza-bg)"/>
  <ellipse cx="200" cy="165" rx="155" ry="95" fill="#000000" opacity="0.35"/>
  
  <!-- 피자 도우 크러스트 -->
  <ellipse cx="200" cy="155" rx="145" ry="85" fill="#d97706" stroke="#b45309" stroke-width="4"/>
  <!-- 치즈와 소스 베이스 -->
  <ellipse cx="200" cy="155" rx="130" ry="74" fill="#fde047" stroke="#dc2626" stroke-width="3"/>

  <!-- 페퍼로니 토핑 -->
  <ellipse cx="140" cy="140" rx="16" ry="12" fill="#b91c1c"/>
  <ellipse cx="195" cy="130" rx="17" ry="12" fill="#991b1b"/>
  <ellipse cx="250" cy="145" rx="16" ry="12" fill="#b91c1c"/>
  <ellipse cx="165" cy="170" rx="17" ry="13" fill="#b91c1c"/>
  <ellipse cx="225" cy="172" rx="16" ry="12" fill="#991b1b"/>

  <!-- 버섯, 올리브, 파프리카 피망 토핑 -->
  <ellipse cx="170" cy="135" rx="6" ry="4" fill="#15803d"/>
  <ellipse cx="230" cy="130" rx="6" ry="4" fill="#15803d"/>
  <ellipse cx="195" cy="175" rx="7" ry="4" fill="#15803d"/>
  
  <ellipse cx="130" cy="165" rx="5" ry="4" fill="#0f172a"/>
  <ellipse cx="265" cy="165" rx="5" ry="4" fill="#0f172a"/>
  <ellipse cx="200" cy="150" rx="6" ry="4" fill="#0f172a"/>

  <!-- 타이틀 뱃지 -->
  <rect x="20" y="20" width="140" height="34" rx="17" fill="#FF5500"/>
  <text x="90" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">샘플: 페퍼로니 피자</text>
</svg>

