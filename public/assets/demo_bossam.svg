<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f1d"/>
      <stop offset="100%" stop-color="#141110"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="160" rx="160" ry="105" fill="#000000" opacity="0.35"/>
  <ellipse cx="200" cy="150" rx="155" ry="100" fill="url(#plate)"/>
  <ellipse cx="200" cy="150" rx="125" ry="78" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- 보쌈 수육 조각들 -->
  <g id="meat-slices">
    <rect x="110" y="115" width="60" height="26" rx="6" fill="#8c5339" stroke="#5c3422" stroke-width="2"/>
    <rect x="110" y="115" width="60" height="8" rx="4" fill="#fce7d2"/>
    <rect x="105" y="135" width="65" height="28" rx="6" fill="#9c5e42" stroke="#5c3422" stroke-width="2"/>
    <rect x="105" y="135" width="65" height="9" rx="4" fill="#fce7d2"/>
    <rect x="115" y="158" width="62" height="28" rx="6" fill="#8c5339" stroke="#5c3422" stroke-width="2"/>
    <rect x="115" y="158" width="62" height="8" rx="4" fill="#fce7d2"/>
  </g>

  <!-- 무생채 / 보쌈 김치 -->
  <g id="kimchi">
    <path d="M 210,120 Q 235,110 255,130 Q 275,150 245,175 Q 215,190 200,165 Z" fill="#dc2626" opacity="0.9"/>
    <path d="M 220,130 Q 240,125 250,140 Q 240,160 220,150 Z" fill="#ef4444"/>
    <circle cx="230" cy="135" r="2" fill="#fef08a"/>
    <circle cx="245" cy="148" r="2.5" fill="#fef08a"/>
    <circle cx="225" cy="160" r="2" fill="#fef08a"/>
  </g>

  <!-- 쌈장 및 마늘 고추 -->
  <circle cx="195" cy="115" r="16" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <circle cx="160" cy="98" r="7" fill="#84cc16"/>
  <ellipse cx="140" cy="100" rx="6" ry="4" fill="#fef08a"/>

  <!-- 타이틀 뱃지 -->
  <rect x="20" y="20" width="130" height="34" rx="17" fill="#FF5500"/>
  <text x="85" y="42" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">샘플: 보쌈 정식</text>
</svg>

